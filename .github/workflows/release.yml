name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to embed (e.g. 1.2.1). Defaults to the latest git tag."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  appimage:
    # Build inside the oldest still-supported Ubuntu LTS so the AppImage only
    # links against an old glibc and runs on every supported distribution.
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            qt5-qmake \
            qtbase5-dev \
            qtbase5-dev-tools \
            qttools5-dev-tools \
            libqt5sql5-sqlite \
            wget \
            ca-certificates \
            file \
            patchelf \
            libfuse2 \
            desktop-file-utils

      - name: Build AppImage
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          chmod +x scripts/build-appimage.sh
          ./scripts/build-appimage.sh

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: PoorMansCatalog-AppImage
          path: |
            *.AppImage
            *.zsync

      - name: Attach AppImage to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.AppImage
            *.zsync

  rpm:
    needs: appimage
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install git
        run: dnf install -y git

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          dnf install -y \
            rpm-build \
            gcc-c++ \
            make \
            qt5-qtbase-devel \
            qt5-qttools-devel \
            desktop-file-utils \
            tar \
            gzip

      - name: Build RPM
        run: |
          chmod +x scripts/build-rpm.sh
          ./scripts/build-rpm.sh

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: PoorMansCatalog-RPM
          path: rpmbuild/RPMS/**/*.rpm

      - name: Attach RPM to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: rpmbuild/RPMS/*/poormanscatalog-[0-9]*.rpm
